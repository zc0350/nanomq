# Cong IoT 登录 + ACL 插件的 NanoMQ 侧配置样例（路线 A：补丁 + 进程内 .so）。
#
# 装到 /etc/nanomq/nanomq.conf 后：
#     nanomq start --conf /etc/nanomq/nanomq.conf
#     nanomq reload --conf /etc/nanomq/nanomq.conf   # 同时让插件重读两个 .jsonl
#
# 与 mosquitto 那份 conf/cong.conf 的对应关系：下面 plugin {} 这一块相当于
# mosquitto 的 `plugin` + 两行 `plugin_opt_*`。差别是 NanoMQ 不给插件传选项，
# 规则文件路径只能走环境变量，见文件末尾和 README。

# #============================================================
# # 监听
# #============================================================

listeners.tcp {
    bind = "0.0.0.0:1883"
    # 改成 [::]:1883 即双栈监听（IPv4 客户端以 ::ffff:a.b.c.d 连入，插件的
    # ip 规则看到的仍是点分十进制；原生 IPv6 客户端是 8 组零填充十六进制，
    # 如 2001:0db8:0000:...:0001，规则里照这个写法）。
    # bind = "[::]:1883"
}

# 用 TLS 客户端证书当身份时才需要打开。注意：证书换出来的用户名会直接跳过本插件
# 的登录 hook（broker 认为已经验过身份），但仍然受 ACL hook 约束——相当于
# mosquitto 上 `use_username_as_clientid` 之外那条证书路径。
# listeners.ssl {
#     bind = "0.0.0.0:8883"
#     keyfile = "/etc/nanomq/certs/key.pem"
#     certfile = "/etc/nanomq/certs/cert.pem"
#     cacertfile = "/etc/nanomq/certs/cacert.pem"
#     verify_peer = true
#     fail_if_no_peer_cert = true
#     # peer_cert_as_username = "cn"
# }

# #============================================================
# # 鉴权
# #============================================================

auth {
    # 实际的登录判定在 cong_auth.jsonl 里，未命中即拒绝。这里写 false 只是让配置
    # 读起来和真实行为一致：补丁装上 hook 后 broker 自带的 verify_connect() 不再
    # 被调用，这个开关不起决定作用。
    allow_anonymous = false

    # 下面两行本来是 broker 原生 ACL 的策略，这里写出来的意义不同：
    #   - no_match：插件不读它（未命中即拒绝是 acl.jsonl 自己的语义，改不掉）。
    #     写成 deny 只是为了万一以后有人打开 auth.acl，原生 ACL 的默认值
    #     （未命中放行）与我们的规则语义相反，先按我们的语义钉死；
    #   - deny_action：会被插件的拒绝共用（补丁把插件的 deny 也按这个值处理）：
    #     ignore = 丢掉这一条消息/订阅，disconnect = 直接断开连接。
    # 两个 broker 的行为差别见 README 的差异清单。
    no_match = deny
    deny_action = ignore

    # 故意不写 auth.acl = {...}，也不写 auth.password = {...}：原生 ACL 保持关闭、
    # 内置口令文件保持不加载，登录与主题授权只由这一套 JSONL 规则决定。
    # acl = {include "/etc/nanomq/nanomq_acl.conf"}
}

# #============================================================
# # 报文与日志
# #============================================================

mqtt {
    max_packet_size = 256KB
    max_mqueue_len = 2048
    keepalive_multiplier = 1.25
}

log {
    # 插件的判定日志走 stderr（见 src/cong_nanomq.c 里的说明），与 broker 用
    # console 时是同一个流，所以交给 systemd/journal 收集时两边不会分家。
    # 用 file 时插件那几行只会出现在 stderr，不会进 nanomq.log。
    to = [console]
    level = warn
}

# #============================================================
# # 插件
# #============================================================

plugin {
    libs = [{
        path = "/usr/local/lib/cong_nanomq.so"
    }]
}

# 规则文件路径由环境变量给出（NanoMQ 的插件框架不向插件传任何配置），默认值是
# /etc/nanomq/cong_auth.jsonl 与 /etc/nanomq/cong_acl.jsonl，也就是 `make install`
# 装出来的位置。用 systemd 时在 unit 里改，见 deploy/nanomq.service：
#
#     CONG_AUTH_FILE=/etc/nanomq/cong_auth.jsonl
#     CONG_ACL_FILE=/etc/nanomq/cong_acl.jsonl
#     CONG_DEBUG=1        # 额外打印放行的判定，排障用，平时别开
