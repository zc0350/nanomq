name: Build and release (cong)

# Fork-friendly pipeline: none of the upstream workflows run outside
# nanomq/nanomq (they are all guarded by `if: github.repository == ...`).
# This one has no repository guard.
#
#   push to master / manual dispatch  -> build, test, upload workflow artifacts
#                                        (tarball + Debian package per arch)
#   tag (v*, 0.*, *-cong*)            -> additionally create a GitHub Release
#                                        with the same files as assets
#
# Actions are pinned by commit SHA with the release in a trailing comment,
# same as the upstream workflows: a tag is mutable, a SHA is not. The pinned
# versions are the ones that run on Node.js 24 (v4 of checkout/upload-artifact
# and download-artifact target Node.js 20, which is deprecated).

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '0.*'
      - '*-cong*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the release job opts into contents: write.
permissions:
  contents: read

env:
  # Release build: plugin framework + ACL support + TLS, and nothing else that
  # widens the attack surface (rule engine / DB backends / JWT stay off).
  # The rpath points at ./lib next to the binary so libraries dropped into a
  # tarball's lib/ are found without LD_LIBRARY_PATH; nothing is bundled today
  # (MbedTLS is linked statically into the broker).
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_PLUGIN=ON
    -DENABLE_ACL=ON
    -DNNG_ENABLE_TLS=ON
    -DBUILD_CLIENT=OFF
    -DBUILD_NANOMQ_CLI=OFF
    -DBUILD_BENCH=OFF
    -DBUILD_APP_LIB=OFF
    -DCMAKE_INSTALL_RPATH='$ORIGIN/lib'
    -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

jobs:
  test:
    name: Rule engine unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install MbedTLS 3.5.2 (NanoNNG TLS requirement)
        run: |
          set -eu
          git clone --depth 1 --branch v3.5.2 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls
          # NanoNNG shares one mbedtls_ssl_config across connections, so
          # concurrent handshakes need mbedTLS's own locking.
          python3 scripts/config.py set MBEDTLS_THREADING_C
          python3 scripts/config.py set MBEDTLS_THREADING_PTHREAD
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF ..
          cmake --build . -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Apply the NanoNNG patches (connect hook, client IP v6, auth cache key)
        run: |
          # ordered: every patch's context assumes its predecessors are applied
          for p in 01-nng-connect-hook 02-nng-client-ip-v6 03-nng-auth-http-cache-key; do
            git -C nng apply --check "$GITHUB_WORKSPACE/cong/patch/$p.patch"
            git -C nng apply "$GITHUB_WORKSPACE/cong/patch/$p.patch"
          done

      - name: Configure
        run: |
          set -o pipefail
          if cmake -S . -B build ${{ env.CMAKE_FLAGS }} 2>&1 | tee configure.log; then
            echo "configure ok"
          else
            echo "cmake configure failed, dumping the error context as annotations"
            { grep -m1 -B3 -A25 "CMake Error" configure.log || tail -n 15 configure.log; } |
              tr -d '\r' | cut -c1-380 | head -n 9 |
              while IFS= read -r line; do echo "::error::CFG: $line"; done
            exit 1
          fi

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configure-diagnostics
          path: |
            configure.log
          if-no-files-found: ignore

      - name: Build the broker and the plugin
        run: |
          set -o pipefail
          if cmake --build build -j $(nproc) --target nanomq cong_nanomq cong_test 2>&1 | tee build.log; then
            echo "build ok"
          else
            echo "build failed, dumping error lines as annotations"
            grep -n -B2 -A8 -E "error:|undefined reference to|Error [0-9]+" build.log | tail -n 25 | tr -d '\r' | cut -c1-400 |
              while IFS= read -r line; do echo "::error::BUILD: $line"; done
            exit 1
          fi

      - name: Run rule engine unit tests
        run: |
          ./build/cong/cong_test
          # also exercise the ctest registration (add_test in cong/CMakeLists.txt)
          ctest --test-dir build/cong --output-on-failure

      - name: Validate sample rule files
        run: |
          python3 cong/tools/cong_pwgen.py validate cong/rules/auth.jsonl cong/rules/acl.jsonl

      - name: Assert the plugin needs only the host hook symbol
        run: |
          nm -u build/cong/cong_nanomq.so
          HOST=$(nm -u build/cong/cong_nanomq.so | awk '{print $2}' | grep -c '^plugin_hook_register$')
          echo "host-provided symbols: $HOST"
          [ "$HOST" -eq 1 ]

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install MbedTLS 3.5.2 (NanoNNG TLS requirement)
        run: |
          set -eu
          git clone --depth 1 --branch v3.5.2 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls
          # NanoNNG shares one mbedtls_ssl_config across connections, so
          # concurrent handshakes need mbedTLS's own locking.
          python3 scripts/config.py set MBEDTLS_THREADING_C
          python3 scripts/config.py set MBEDTLS_THREADING_PTHREAD
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF ..
          cmake --build . -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Apply the NanoNNG patches (connect hook, client IP v6, auth cache key)
        run: |
          # ordered: every patch's context assumes its predecessors are applied
          for p in 01-nng-connect-hook 02-nng-client-ip-v6 03-nng-auth-http-cache-key; do
            git -C nng apply --check "$GITHUB_WORKSPACE/cong/patch/$p.patch"
            git -C nng apply "$GITHUB_WORKSPACE/cong/patch/$p.patch"
          done

      - name: Configure
        run: |
          set -o pipefail
          if cmake -S . -B build ${{ env.CMAKE_FLAGS }} 2>&1 | tee configure.log; then
            echo "configure ok"
          else
            echo "cmake configure failed, dumping the error context as annotations"
            { grep -m1 -B3 -A25 "CMake Error" configure.log || tail -n 15 configure.log; } |
              tr -d '\r' | cut -c1-380 | head -n 9 |
              while IFS= read -r line; do echo "::error::CFG: $line"; done
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if cmake --build build -j $(nproc) --target nanomq cong_nanomq 2>&1 | tee build.log; then
            echo "build ok"
          else
            echo "build failed, dumping error lines as annotations"
            grep -n -B2 -A8 -E "error:|undefined reference to|Error [0-9]+" build.log | tail -n 25 | tr -d '\r' | cut -c1-400 |
              while IFS= read -r line; do echo "::error::BUILD: $line"; done
            exit 1
          fi

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            # not a version tag: derive from the in-tree version.h so the
            # artifact name never drifts from the upstream version
            VERSION=$(awk '/^#define NANO_VER_MAJOR /{M=$3}
                           /^#define NANO_VER_MINOR /{m=$3}
                           /^#define NANO_VER_PATCH /{p=$3}
                           END{print M"."m"."p}' nanomq/include/version.h)
            VERSION="${VERSION}+$(git rev-parse --short HEAD)"
          fi
          # keep release-asset URLs simple: no '+' in file names
          VERSION="${VERSION//+/_}"
          NAME="nanomq-cong-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p pack/${NAME}
          cp build/nanomq/nanomq pack/${NAME}/
          cp build/cong/cong_nanomq.so pack/${NAME}/
          # Nothing is bundled: readelf shows the broker needs only libc
          # (NanoNNG's MbedTLS is linked statically into it) and the plugin
          # only the system libcrypto.so.3, which the Debian package declares
          # as a dependency.
          cp cong/conf/nanomq.conf pack/${NAME}/
          cp -r cong/rules pack/${NAME}/rules
          cp cong/deploy/nanomq.service pack/${NAME}/
          cp cong/README.md pack/${NAME}/
          cp README.md pack/${NAME}/UPSTREAM-README.md
          tar -czf ${NAME}.tar.gz -C pack ${NAME}
          sha256sum ${NAME}.tar.gz > ${NAME}.tar.gz.sha256
          echo "artifact_name=${NAME}" >> $GITHUB_ENV
          # the Debian package step takes its version from here; build-deb.sh
          # turns the '_' of a master build into '+' for dpkg
          echo "pkg_version=${VERSION}" >> $GITHUB_ENV

      - name: Build the Debian package
        run: |
          # the tarball step staged the two binaries; this lays them out the
          # way a Debian package should and wraps them with dpkg-deb (no
          # debhelper, no extra build-deps - see cong/tools/build-deb.sh)
          DEB=$(sh cong/tools/build-deb.sh --stage "pack/${{ env.artifact_name }}" \
                --version "${{ env.pkg_version }}" --arch ${{ matrix.arch }} --out .)
          echo "deb_path=${DEB}" >> $GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ env.artifact_name }}.tar.gz
            ${{ env.artifact_name }}.tar.gz.sha256
            ${{ env.deb_path }}
            ${{ env.deb_path }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Verify the package checksums
        run: |
          cd dist
          sha256sum -c *.sha256

      - name: Create or update the release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # re-pushed tag: refresh the assets instead of failing
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
