name: Build and release (cong)

# Fork-friendly pipeline: none of the upstream workflows run outside
# nanomq/nanomq (they are all guarded by `if: github.repository == ...`).
# This one has no repository guard.
#
#   push to master / manual dispatch  -> build, test, upload workflow artifacts
#   tag (v*, 0.*, *-cong*)            -> additionally create a GitHub Release
#                                        with the packaged binaries

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '0.*'
      - '*-cong*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release build: plugin framework + ACL support + TLS, and nothing else that
  # widens the attack surface (rule engine / DB backends / JWT stay off).
  # The rpath points at ./lib next to the binary so the bundled MbedTLS
  # libraries in the release tarball are found without LD_LIBRARY_PATH.
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_PLUGIN=ON
    -DENABLE_ACL=ON
    -DNNG_ENABLE_TLS=ON
    -DBUILD_CLIENT=OFF
    -DBUILD_NANOMQ_CLI=OFF
    -DBUILD_BENCH=OFF
    -DBUILD_APP_LIB=OFF
    -DCMAKE_INSTALL_RPATH='$ORIGIN/lib'
    -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

jobs:
  test:
    name: Rule engine unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install MbedTLS 3.5.2 (NanoNNG TLS requirement)
        run: |
          set -eu
          git clone --depth 1 --branch v3.5.2 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls
          # NanoNNG shares one mbedtls_ssl_config across connections, so
          # concurrent handshakes need mbedTLS's own locking.
          python3 scripts/config.py set MBEDTLS_THREADING_C
          python3 scripts/config.py set MBEDTLS_THREADING_PTHREAD
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF -DCMAKE_INSTALL_RPATH='' ..
          cmake --build . -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Apply the NanoNNG connect-hook patch
        run: |
          git -C nng apply --check "$GITHUB_WORKSPACE/cong/patch/01-nng-connect-hook.patch"
          git -C nng apply "$GITHUB_WORKSPACE/cong/patch/01-nng-connect-hook.patch"

      - name: Configure
        run: |
          set -o pipefail
          if cmake -S . -B build ${{ env.CMAKE_FLAGS }} 2>&1 | tee configure.log; then
            echo "configure ok"
          else
            echo "cmake configure failed, dumping the error context as annotations"
            { grep -m1 -B3 -A25 "CMake Error" configure.log || tail -n 15 configure.log; } |
              tr -d '\r' | cut -c1-380 | head -n 9 |
              while IFS= read -r line; do echo "::error::CFG: $line"; done
            exit 1
          fi

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-diagnostics
          path: |
            configure.log
          if-no-files-found: ignore

      - name: Build the broker and the plugin
        run: |
          set -o pipefail
          if cmake --build build -j $(nproc) --target nanomq cong_nanomq cong_test 2>&1 | tee build.log; then
            echo "build ok"
          else
            echo "build failed, dumping error lines as annotations"
            grep -n -B2 -A8 -iE "error(:|\b)" build.log | tail -n 25 | tr -d '\r' | cut -c1-400 |
              while IFS= read -r line; do echo "::error::BUILD: $line"; done
            exit 1
          fi

      - name: Run rule engine unit tests
        run: ./build/cong/cong_test

      - name: Validate sample rule files
        run: |
          python3 cong/tools/cong_pwgen.py validate cong/rules/auth.jsonl cong/rules/acl.jsonl

      - name: Assert the plugin needs only the host hook symbol
        run: |
          nm -u build/cong/cong_nanomq.so
          HOST=$(nm -u build/cong/cong_nanomq.so | awk '{print $2}' | grep -c '^plugin_hook_register$')
          echo "host-provided symbols: $HOST"
          [ "$HOST" -eq 1 ]

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install MbedTLS 3.5.2 (NanoNNG TLS requirement)
        run: |
          set -eu
          git clone --depth 1 --branch v3.5.2 https://github.com/Mbed-TLS/mbedtls.git
          cd mbedtls
          # NanoNNG shares one mbedtls_ssl_config across connections, so
          # concurrent handshakes need mbedTLS's own locking.
          python3 scripts/config.py set MBEDTLS_THREADING_C
          python3 scripts/config.py set MBEDTLS_THREADING_PTHREAD
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=OFF ..
          cmake --build . -j $(nproc)
          sudo make install
          sudo ldconfig

      - name: Apply the NanoNNG connect-hook patch
        run: |
          git -C nng apply --check "$GITHUB_WORKSPACE/cong/patch/01-nng-connect-hook.patch"
          git -C nng apply "$GITHUB_WORKSPACE/cong/patch/01-nng-connect-hook.patch"

      - name: Configure
        run: |
          set -o pipefail
          if cmake -S . -B build ${{ env.CMAKE_FLAGS }} 2>&1 | tee configure.log; then
            echo "configure ok"
          else
            echo "cmake configure failed, dumping the error context as annotations"
            { grep -m1 -B3 -A25 "CMake Error" configure.log || tail -n 15 configure.log; } |
              tr -d '\r' | cut -c1-380 | head -n 9 |
              while IFS= read -r line; do echo "::error::CFG: $line"; done
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if cmake --build build -j $(nproc) --target nanomq cong_nanomq 2>&1 | tee build.log; then
            echo "build ok"
          else
            echo "build failed, dumping error lines as annotations"
            grep -n -B2 -A8 -iE "error(:|\b)" build.log | tail -n 25 | tr -d '\r' | cut -c1-400 |
              while IFS= read -r line; do echo "::error::BUILD: $line"; done
            exit 1
          fi

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            VERSION="0.25.7+$(git rev-parse --short HEAD)"
          fi
          NAME="nanomq-cong-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p pack/${NAME}/lib
          cp build/nanomq/nanomq pack/${NAME}/
          cp build/cong/cong_nanomq.so pack/${NAME}/
          # NanoNNG's TLS links the MbedTLS built above; bundle its runtime
          # libraries so the tarball runs without a system mbedtls install
          # (the binary carries an $ORIGIN/lib rpath).
          cp /usr/local/lib/libmbedcrypto.so.* pack/${NAME}/lib/ || true
          cp /usr/local/lib/libmbedx509.so.*   pack/${NAME}/lib/ || true
          cp /usr/local/lib/libmbedtls.so.*    pack/${NAME}/lib/ || true
          cp cong/conf/nanomq.conf pack/${NAME}/
          cp -r cong/rules pack/${NAME}/rules
          cp cong/deploy/nanomq.service pack/${NAME}/
          cp cong/README.md pack/${NAME}/
          cp README.md pack/${NAME}/UPSTREAM-README.md
          tar -czf ${NAME}.tar.gz ${NAME}
          sha256sum ${NAME}.tar.gz > ${NAME}.tar.gz.sha256
          echo "artifact_name=${NAME}" >> $GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ env.artifact_name }}.tar.gz
            ${{ env.artifact_name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create the release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
